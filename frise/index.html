<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le parcours d'une idée</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #F7F5F0;
        }

        .idea-journey {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px 10px 30px;
            background: #F7F5F0;
        }

        .idea-journey-inner {
            max-width: 100%;
            margin: auto;
        }

        .idea-journey-path {
            position: relative;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            align-items: center;
        }

        /* Ligne du parcours */
        .idea-journey-path::before {
            content: "";
            position: absolute;
            left: 5%;
            right: 5%;
            top: 50%;
            height: 2px;
            background: #171717;
            opacity: .12;
            z-index: 0;
        }

        /* Chaque étape */
        .idea-step {
            position: relative;
            z-index: 1;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #171717;
            transition: transform .3s ease, box-shadow .3s ease;
            cursor: pointer;
        }

        .idea-step:hover {
            transform: translateY(-6px) rotate(-1deg);
            box-shadow: 0 12px 30px rgba(0,0,0,.13);
        }

        .idea-step:nth-child(2) { transform: translateY(10px); }
        .idea-step:nth-child(3) { transform: translateY(-3px); }
        .idea-step:nth-child(4) { transform: translateY(12px); }
        .idea-step:nth-child(5) { transform: translateY(-2px); }

        .idea-number {
            font-size: 11px;
            font-weight: 800;
            opacity: .6;
        }

        .idea-count {
            font-size: clamp(28px, 3vw, 42px);
            font-weight: 800;
            line-height: .9;
            letter-spacing: -.05em;
        }

        .idea-count span {
            display: block;
            font-size: 10px;
            line-height: 1;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .idea-name {
            font-size: clamp(13px, 1.4vw, 18px);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -.025em;
        }

        .idea-arrow {
            font-size: 18px;
            align-self: flex-end;
            transition: transform .2s ease;
        }

        .idea-step:hover .idea-arrow {
            transform: translate(3px, -3px);
        }

        /* Mobile */
        @media (max-width: 600px) {
            .idea-journey-path {
                grid-template-columns: repeat(2, 1fr);
            }
            .idea-journey-path::before {
                display: none;
            }
            .idea-step:nth-child(2),
            .idea-step:nth-child(3),
            .idea-step:nth-child(4),
            .idea-step:nth-child(5) {
                transform: none;
            }
        }
    </style>
</head>
<body>

    <section class="idea-journey">
        <div class="idea-journey-inner">

            <div class="idea-journey-path">

                <!-- 01 : GERME -->
                <div class="idea-step" style="background:#FB6F92;" data-category="germe">
                    <div class="idea-number">01</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        Les idées<br>
                        germent
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 02 : GRANDIT -->
                <div class="idea-step" style="background:#FDC500;" data-category="grandit">
                    <div class="idea-number">02</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée<br>
                        grandit
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 03 : FORME -->
                <div class="idea-step" style="background:#9BC045;" data-category="forme">
                    <div class="idea-number">03</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée<br>
                        prend forme
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 04 : SOLUTION -->
                <div class="idea-step" style="background:#23C0F1;" data-category="solution">
                    <div class="idea-number">04</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée devient<br>
                        solution
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 05 : DEPLOIE -->
                <div class="idea-step" style="background:#E8873A;" data-category="deploie">
                    <div class="idea-number">05</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée<br>
                        se déploie
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

            </div>

        </div>
    </section>

  <script>
    const API_URL = "https://portaitsexpo.charlottepiau-innova.workers.dev";
    // URL de ta page principale (change-la si c'est l'URL de ton site WordPress !)
    const GALLERY_BASE_URL = "https://charlinnova-lab.github.io/portraits/"; 

    async function updateCategoryCounts() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            const items = data.records || (Array.isArray(data) ? data : []);

            const counts = { germe: 0, grandit: 0, forme: 0, solution: 0, deploie: 0 };

            items.forEach(item => {
                const fields = item.fields || item;
                let rawCategory = fields.Category || fields.category || "";
                if (Array.isArray(rawCategory)) rawCategory = rawCategory.join(" ");
                const category = rawCategory.toLowerCase();

                if (category.includes("germent") || category.includes("ecoles") || category.includes("écoles")) counts.germe++;
                else if (category.includes("grandit") || category.includes("centres techniques")) counts.grandit++;
                else if (category.includes("start-up") || category.includes("startup")) counts.forme++;
                else if (category.includes("solution") || category.includes("entreprises")) counts.solution++;
                else if (category.includes("deplo") || category.includes("dynamiques collectives")) counts.deploie++;
            });

            document.querySelectorAll('.idea-step').forEach(step => {
                const catKey = step.getAttribute('data-category');
                if (catKey && counts[catKey] !== undefined) {
                    const countEl = step.querySelector('.count-value');
                    if (countEl) countEl.textContent = counts[catKey];
                    
                    // Rend la carte cliquable et ouvre la galerie filtrée (sur le parent de l'iframe si dans WP)
                    step.addEventListener('click', () => {
                        const targetUrl = `${GALLERY_BASE_URL}?cat=${catKey}`;
                        if (window.top !== window.self) {
                            window.top.location.href = targetUrl; // Redirige la page entière si dans un iframe
                        } else {
                            window.location.href = targetUrl;
                        }
                    });
                }
            });

        } catch (error) {
            console.error("Erreur lors du calcul des catégories :", error);
        }
    }

    document.addEventListener("DOMContentLoaded", updateCategoryCounts);
</script>
