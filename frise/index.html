<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le parcours d'une idée</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: #f8fafc;
        }

        .idea-journey {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            max-width: 1200px;
            margin: 40px auto;
            box-shadow: 0 4px 15px rgba(43, 58, 130, 0.04);
        }

        .idea-journey-path {
            position: relative;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            align-items: center;
            justify-items: center;
        }

        /* Ligne de fond qui relie les cercles */
        .idea-journey-path::before {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            top: 50%;
            height: 3px;
            background: #2b3a82;
            opacity: .15;
            z-index: 0;
            transform: translateY(-50%);
        }

        .idea-step {
            position: relative;
            z-index: 1;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            padding: 24px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            color: #171717;
            text-decoration: none;
            transition: transform .3s ease, box-shadow .3s ease;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,.07);
        }

        .idea-step:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 30px rgba(0,0,0,.15);
        }

        /* Alternance de hauteur */
        .idea-step:nth-child(2) { transform: translateY(12px); }
        .idea-step:nth-child(3) { transform: translateY(-4px); }
        .idea-step:nth-child(4) { transform: translateY(12px); }
        .idea-step:nth-child(5) { transform: translateY(-4px); }

        .idea-step:nth-child(2):hover { transform: translateY(6px) scale(1.03); }
        .idea-step:nth-child(3):hover { transform: translateY(-10px) scale(1.03); }
        .idea-step:nth-child(4):hover { transform: translateY(6px) scale(1.03); }
        .idea-step:nth-child(5):hover { transform: translateY(-10px) scale(1.03); }

        .idea-number {
            font-size: 12px !important;
            font-weight: 800;
            opacity: .65;
            letter-spacing: .5px;
        }

        /* TITRE : 2 lignes (L'idée / verbe), gros */
        .idea-name {
            font-size: 22px !important;
            font-weight: 900;
            line-height: 1.15 !important;
            letter-spacing: -.02em;
            padding: 0 4px;
        }

        .idea-name .line {
            display: block !important;
        }

        .idea-name .verb {
            font-size: 21px !important;
        }

        .idea-count-wrapper {
            font-size: 11px !important;
            font-weight: 800;
            opacity: .85;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 4px;
        }

        .idea-arrow {
            position: absolute;
            bottom: 18px;
            right: 26px;
            font-size: 14px;
            transition: transform .2s ease;
            opacity: .75;
        }

        .idea-step:hover .idea-arrow {
            transform: translate(3px, -3px);
            opacity: 1;
        }

        /* Tablette / mobile */
        @media (max-width: 1050px) {
            .idea-journey-path {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
            .idea-journey-path::before { display: none; }
            .idea-step:nth-child(n) { transform: none; }
            .idea-step:nth-child(n):hover { transform: translateY(-6px) scale(1.03); }
        }

        @media (max-width: 500px) {
            .idea-journey-path { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <section class="idea-journey">
        <div class="idea-journey-inner">
            <div class="idea-journey-path">

                <!-- 01 : GERME -->
                <div class="idea-step" style="background:#FB6F92;" data-category="germe">
                    <div class="idea-number">01</div>
                    <div class="idea-name">
                        <span class="line">L'idée</span>
                        <span class="line verb">germe</span>
                    </div>
                    <div class="idea-count-wrapper"><span class="count-value">9</span> portraits</div>
                    <span class="idea-arrow">↗</span>
                </div>

                <!-- 02 : GRANDIT -->
                <div class="idea-step" style="background:#FFC400;" data-category="grandit">
                    <div class="idea-number">02</div>
                    <div class="idea-name">
                        <span class="line">L'idée</span>
                        <span class="line verb">grandit</span>
                    </div>
                    <div class="idea-count-wrapper"><span class="count-value">8</span> portraits</div>
                    <span class="idea-arrow">↗</span>
                </div>

                <!-- 03 : PREND FORME -->
                <div class="idea-step" style="background:#9DBF45;" data-category="prend-forme">
                    <div class="idea-number">03</div>
                    <div class="idea-name">
                        <span class="line">L'idée</span>
                        <span class="line verb">prend forme</span>
                    </div>
                    <div class="idea-count-wrapper"><span class="count-value">9</span> portraits</div>
                    <span class="idea-arrow">↗</span>
                </div>

                <!-- 04 : DEVIENT SOLUTION -->
                <div class="idea-step" style="background:#22C0F5;" data-category="solution">
                    <div class="idea-number">04</div>
                    <div class="idea-name">
                        <span class="line">L'idée</span>
                        <span class="line verb">devient solution</span>
                    </div>
                    <div class="idea-count-wrapper"><span class="count-value">6</span> portraits</div>
                    <span class="idea-arrow">↗</span>
                </div>

                <!-- 05 : SE DEPLOIE -->
                <div class="idea-step" style="background:#E8883B;" data-category="deploie">
                    <div class="idea-number">05</div>
                    <div class="idea-name">
                        <span class="line">L'idée</span>
                        <span class="line verb">se déploie</span>
                    </div>
                    <div class="idea-count-wrapper"><span class="count-value">7</span> portraits</div>
                    <span class="idea-arrow">↗</span>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
