<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le parcours d'une idée</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #F7F5F0;
        }

        .idea-journey {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px 10px 30px;
            background: #F7F5F0;
        }

        .idea-journey-inner {
            max-width: 100%;
            margin: auto;
        }

        .idea-journey-path {
            position: relative;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            align-items: center;
        }

        /* Ligne de fond du parcours */
        .idea-journey-path::before {
            content: "";
            position: absolute;
            left: 5%;
            right: 5%;
            top: 50%;
            height: 2px;
            background: #171717;
            opacity: .12;
            z-index: 0;
        }

        /* Cartes d'étapes */
        .idea-step {
            position: relative;
            z-index: 1;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #171717;
            transition: transform .3s ease, box-shadow .3s ease;
            cursor: pointer;
        }

        .idea-step:hover {
            transform: translateY(-6px) rotate(-1deg);
            box-shadow: 0 12px 30px rgba(0,0,0,.13);
        }

        .idea-step:nth-child(2) { transform: translateY(10px); }
        .idea-step:nth-child(3) { transform: translateY(-3px); }
        .idea-step:nth-child(4) { transform: translateY(12px); }
        .idea-step:nth-child(5) { transform: translateY(-2px); }

        .idea-number {
            font-size: 11px;
            font-weight: 800;
            opacity: .6;
        }

        /* Bloc compteur gros chiffres */
        .idea-count-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin: 4px 0;
        }

        .count-value {
            font-size: clamp(38px, 4.2vw, 58px) !important;
            font-weight: 900 !important;
            line-height: 0.85 !important;
            letter-spacing: -0.04em;
            display: block;
        }

        .count-label {
            font-size: 9px !important;
            font-weight: 800 !important;
            line-height: 1.2 !important;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.75;
            margin-top: 4px;
            display: block;
        }

        .idea-name {
            font-size: clamp(13px, 1.4vw, 18px);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -.025em;
        }

        .idea-arrow {
            font-size: 18px;
            align-self: flex-end;
            transition: transform .2s ease;
        }

        .idea-step:hover .idea-arrow {
            transform: translate(3px, -3px);
        }

        /* Mobile */
        @media (max-width: 600px) {
            .idea-journey-path {
                grid-template-columns: repeat(2, 1fr);
            }
            .idea-journey-path::before {
                display: none;
            }
            .idea-step:nth-child(2),
            .idea-step:nth-child(3),
            .idea-step:nth-child(4),
            .idea-step:nth-child(5) {
                transform: none;
            }
        }
    </style>
</head>
<body>

    <section class="idea-journey">
        <div class="idea-journey-inner">

            <div class="idea-journey-path">

                <!-- 01 : GERME -->
                <div class="idea-step" style="background:#FB6F92;" data-category="germe">
                    <div class="idea-number">01</div>
                    <div class="idea-count-wrapper">
                        <span class="count-value">-</span>
                        <span class="count-label">portraits</span>
                    </div>
                    <div class="idea-name">
                        Les idées<br>
                        germent
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 02 : GRANDIT -->
                <div class="idea-step" style="background:#FDC500;" data-category="grandit">
                    <div class="idea-number">02</div>
                    <div class="idea-count-wrapper">
                        <span class="count-value">-</span>
                        <span class="count-label">portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée<br>
                        grandit
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 03 : FORME -->
                <div class="idea-step" style="background:#9BC045;" data-category="forme">
                    <div class="idea-number">03</div>
                    <div class="idea-count-wrapper">
                        <span class="count-value">-</span>
                        <span class="count-label">portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée<br>
                        prend forme
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 04 : SOLUTION -->
                <div class="idea-step" style="background:#23C0F1;" data-category="solution">
                    <div class="idea-number">04</div>
                    <div class="idea-count-wrapper">
                        <span class="count-value">-</span>
                        <span class="count-label">portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée devient<br>
                        solution
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 05 : DEPLOIE -->
                <div class="idea-step" style="background:#E8873A;" data-category="deploie">
                    <div class="idea-number">05</div>
                    <div class="idea-count-wrapper">
                        <span class="count-value">-</span>
                        <span class="count-label">portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée<br>
                        se déploie
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

            </div>

        </div>
    </section>

    <script>
        const API_URL = "https://portaitsexpo.charlottepiau-innova.workers.dev";

        async function updateCategoryCounts() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const items = data.records || (Array.isArray(data) ? data : []);
                const counts = { germe: 0, grandit: 0, forme: 0, solution: 0, deploie: 0 };

                items.forEach(item => {
                    const fields = item.fields || item;
                    
                    let rawCategory = fields["Category"] || fields["Catégory"] || fields["category"] || fields["Catégorie"] || "";
                    if (Array.isArray(rawCategory)) rawCategory = rawCategory[0] || "";
                    
                    const category = String(rawCategory).trim().toLowerCase();

                    // 01. GERME : "Là où les idées germent : écoles & laboratoires"
                    if (category.includes("écoles & laboratoires") || category.includes("ecoles & laboratoires") || category.includes("idées germent")) {
                        counts.germe++;
                    }
                    // 02. GRANDIT : "Là où l’idée grandit et est testées : centres techniques & dispositifs d’accompagnement"
                    else if (category.includes("grandit") || category.includes("centres techniques")) {
                        counts.grandit++;
                    }
                    // 03. FORME : "Là où l’idée prend forme : start-up"
                    else if (category.includes("prend forme") || category.includes("start-up") || category.includes("startup")) {
                        counts.forme++;
                    }
                    // 04. SOLUTION : "Là où l’idée se transforme en solution : entreprises"
                    else if (category.includes("transforme en solution") || category.includes("entreprises")) {
                        counts.solution++;
                    }
                    // 05. DEPLOIE : "Là où l’idée se déploit : dynamiques collectives"
                    else if (category.includes("déploit") || category.includes("déploie") || category.includes("deploie") || category.includes("dynamiques collectives")) {
                        counts.deploie++;
                    }
                    else if (category !== "") {
                        console.warn("Catégorie Airtable non capturée :", `"${rawCategory}"`);
                    }
                });

                // Mise à jour de l'affichage des 5 compteurs
                document.querySelectorAll('.idea-step').forEach(step => {
                    const catKey = step.getAttribute('data-category');
                    if (catKey && counts[catKey] !== undefined) {
                        const countEl = step.querySelector('.count-value');
                        if (countEl) countEl.textContent = counts[catKey];
                    }
                });

            } catch (error) {
                console.error("Erreur lors du calcul des catégories :", error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateCategoryCounts();

            document.querySelectorAll('.idea-step').forEach(step => {
                step.addEventListener('click', () => {
                    const catKey = step.getAttribute('data-category');
                    if (catKey) {
                        window.parent.postMessage({ type: 'FILTER_GALLERY', category: catKey }, '*');
                    }
                });
            });
        });
    </script>
</body>
</html>
