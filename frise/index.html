<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le parcours d'une idée</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #F7F5F0;
        }

        .idea-journey {
            font-family: Arial, Helvetica, sans-serif;
            padding: 70px 20px 90px;
            background: #F7F5F0;
        }

        .idea-journey-inner {
            max-width: 1180px;
            margin: auto;
        }

        .idea-journey-title {
            margin-bottom: 45px;
        }

        .idea-journey-eyebrow {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .12em;
            margin-bottom: 12px;
        }

        .idea-journey-title h2 {
            margin: 0;
            font-size: clamp(38px, 5vw, 64px);
            line-height: .95;
            letter-spacing: -.045em;
        }

        .idea-journey-path {
            position: relative;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 22px;
            align-items: center;
        }

        /* Ligne du parcours */
        .idea-journey-path::before {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            top: 50%;
            height: 2px;
            background: #171717;
            opacity: .12;
            z-index: 0;
        }

        /* Chaque étape */
        .idea-step {
            position: relative;
            z-index: 1;
            aspect-ratio: 1 / 1;
            border-radius: 30px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #171717;
            transition: transform .3s ease, box-shadow .3s ease;
            cursor: pointer;
        }

        .idea-step:hover {
            transform: translateY(-10px) rotate(-1deg);
            box-shadow: 0 18px 40px rgba(0,0,0,.13);
        }

        .idea-step:nth-child(2) {
            transform: translateY(18px);
        }

        .idea-step:nth-child(2):hover {
            transform: translateY(8px) rotate(1deg);
        }

        .idea-step:nth-child(3) {
            transform: translateY(-5px);
        }

        .idea-step:nth-child(4) {
            transform: translateY(20px);
        }

        .idea-step:nth-child(4):hover {
            transform: translateY(10px) rotate(-1deg);
        }

        .idea-step:nth-child(5) {
            transform: translateY(-2px);
        }

        .idea-number {
            font-size: 13px;
            font-weight: 800;
            opacity: .6;
        }

        .idea-count {
            font-size: clamp(38px, 4vw, 58px);
            font-weight: 800;
            line-height: .9;
            letter-spacing: -.05em;
        }

        .idea-count span {
            display: block;
            font-size: 11px;
            line-height: 1;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-top: 7px;
        }

        .idea-name {
            font-size: clamp(18px, 2vw, 25px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.025em;
            max-width: 180px;
        }

        .idea-arrow {
            font-size: 22px;
            align-self: flex-end;
            transition: transform .2s ease;
        }

        .idea-step:hover .idea-arrow {
            transform: translate(4px, -4px);
        }

        /* Mobile */
        @media (max-width: 850px) {
            .idea-journey-path {
                grid-template-columns: repeat(2, 1fr);
            }

            .idea-journey-path::before {
                display: none;
            }

            .idea-step:nth-child(2),
            .idea-step:nth-child(3),
            .idea-step:nth-child(4),
            .idea-step:nth-child(5) {
                transform: none;
            }

            .idea-step:hover {
                transform: translateY(-6px);
            }
        }

        @media (max-width: 500px) {
            .idea-journey-path {
                grid-template-columns: 1fr;
                max-width: 320px;
                margin: auto;
            }

            .idea-step {
                aspect-ratio: 1 / .85;
            }
        }
    </style>
</head>
<body>

    <section class="idea-journey">
        <div class="idea-journey-inner">

            <div class="idea-journey-title">
                <div class="idea-journey-eyebrow">
                    Explorer l'exposition
                </div>
                <h2>
                    Le parcours<br>
                    d'une idée.
                </h2>
            </div>

            <div class="idea-journey-path">

                <!-- 01 : GERME -->
                <div class="idea-step" style="background:#FB6F92;" data-category="germe">
                    <div class="idea-number">01</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        Les idées<br>
                        germent
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 02 : GRANDIT -->
                <div class="idea-step" style="background:#FDC500;" data-category="grandit">
                    <div class="idea-number">02</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée<br>
                        grandit
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 03 : FORME -->
                <div class="idea-step" style="background:#9BC045;" data-category="forme">
                    <div class="idea-number">03</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée<br>
                        prend forme
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 04 : SOLUTION -->
                <div class="idea-step" style="background:#23C0F1;" data-category="solution">
                    <div class="idea-number">04</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée devient<br>
                        solution
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

                <!-- 05 : DEPLOIE -->
                <div class="idea-step" style="background:#E8873A;" data-category="deploie">
                    <div class="idea-number">05</div>
                    <div class="idea-count">
                        <span class="count-value">-</span>
                        <span>portraits</span>
                    </div>
                    <div class="idea-name">
                        L'idée<br>
                        se déploie
                    </div>
                    <div class="idea-arrow">↗</div>
                </div>

            </div>

        </div>
    </section>

   <script>
    const API_URL = "https://portaitsexpo.charlottepiau-innova.workers.dev";

    async function updateCategoryCounts() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            
            const items = data.records || (Array.isArray(data) ? data : []);

            const counts = {
                germe: 0,
                grandit: 0,
                forme: 0,
                solution: 0,
                deploie: 0
            };

            items.forEach(item => {
                const fields = item.fields || item;
                
                // Récupération de la catégorie (conversion en texte si Airtable renvoie un tableau)
                let rawCategory = fields.Category || fields.category || "";
                if (Array.isArray(rawCategory)) {
                    rawCategory = rawCategory.join(" ");
                }
                
                const category = rawCategory.toLowerCase();

                // Filtrage strict par mot-clé unique
                if (category.includes("germent") || category.includes("ecoles") || category.includes("écoles")) {
                    counts.germe++;
                } else if (category.includes("grandit") || category.includes("centres techniques")) {
                    counts.grandit++;
                } else if (category.includes("start-up") || category.includes("startup")) {
                    counts.forme++;
                } else if (category.includes("solution") || category.includes("entreprises")) {
                    counts.solution++;
                } else if (category.includes("deplo") || category.includes("dynamiques collectives")) {
                    counts.deploie++;
                }
            });

            // Mise à jour de l'affichage
            document.querySelectorAll('.idea-step').forEach(step => {
                const catKey = step.getAttribute('data-category');
                if (catKey && counts[catKey] !== undefined) {
                    const countEl = step.querySelector('.count-value');
                    if (countEl) {
                        countEl.textContent = counts[catKey];
                    }
                }
            });

        } catch (error) {
            console.error("Erreur lors du calcul des catégories :", error);
        }
    }

    document.addEventListener("DOMContentLoaded", updateCategoryCounts);
</script>
