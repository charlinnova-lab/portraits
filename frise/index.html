<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le parcours d'une idée</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f8fafc;
        }

        .idea-journey {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            max-width: 1100px;
            margin: 40px auto;
            box-shadow: 0 4px 15px rgba(43, 58, 130, 0.04);
        }

        .idea-journey-inner {
            max-width: 100%;
            margin: auto;
        }

        .idea-journey-path {
            position: relative;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            align-items: center;
            justify-items: center;
        }

        /* Ligne de fond qui relie les cercles */
        .idea-journey-path::before {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            top: 50%;
            height: 3px;
            background: #2b3a82;
            opacity: .15;
            z-index: 0;
            transform: translateY(-50%);
        }

        /* Cercles agrandis pour accueillir les gros textes */
        .idea-step {
            position: relative;
            z-index: 1;
            width: 185px;
            height: 185px;
            border-radius: 50%;
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            color: #171717;
            transition: transform .3s ease, box-shadow .3s ease;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,.07);
        }

        .idea-step:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 30px rgba(0,0,0,.15);
        }

        /* Alternance de hauteur */
        .idea-step:nth-child(2) { transform: translateY(12px); }
        .idea-step:nth-child(3) { transform: translateY(-4px); }
        .idea-step:nth-child(4) { transform: translateY(12px); }
        .idea-step:nth-child(5) { transform: translateY(-4px); }

        .idea-step:nth-child(2):hover { transform: translateY(6px) scale(1.03); }
        .idea-step:nth-child(3):hover { transform: translateY(-10px) scale(1.03); }
        .idea-step:nth-child(4):hover { transform: translateY(6px) scale(1.03); }
        .idea-step:nth-child(5):hover { transform: translateY(-10px) scale(1.03); }

        .idea-number {
            font-size: 11px;
            font-weight: 800;
            opacity: .65;
            letter-spacing: 0.5px;
        }

        /* TITRE PLUS GROS ET SUR 2 LIGNES */
        .idea-name {
            font-size: clamp(15px, 1.4vw, 18px);
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -.025em;
            text-transform: none;
            padding: 0 4px;
        }

        /* Nombre de portraits en dessous */
        .idea-count-wrapper {
            font-size: 10.5px;
            font-weight: 800;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .count-value {
            font-weight: 900 !important;
        }

        .idea-arrow {
            position: absolute;
            bottom: 14px;
            right: 20px;
            font-size: 13px;
            transition: transform .2s ease;
            opacity: 0.75;
        }

        .idea-step:hover .idea-arrow {
            transform: translate(3px, -3px);
            opacity: 1;
        }

        /* Mobile */
        @media (max-width: 950px) {
            .idea-journey-path {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
            .idea-journey-path::before {
                display: none;
            }
            .idea-step:nth-child(2),
            .idea-step:nth-child(3),
            .idea-step:nth-child(4),
            .idea-step:nth-child(5) {
                transform: none;
            }
            .idea-step:nth-child(2):hover,
            .idea-step:nth-child(3):hover,
            .idea-step:nth-child(4):hover,
            .idea-step:nth-child(5):hover {
                transform: translateY(-6px) scale(1.03);
            }
        }

        @media (max-width: 500px) {
            .idea-journey-path {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <section class="idea-journey">
        <div class="idea-journey-inner">

            <div class="idea-journey-path">

                <!-- 01 : GERME -->
                <div class="idea-step" style="background:#FB6F92;" data-category="germe">
                    <div class="idea-number">01</div>
                    <div class="idea-name">
