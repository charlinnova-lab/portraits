<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portraits — L'innovation, une histoire collective</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- =================================================
             BARRE DE RECHERCHE & FILTRES DE CATÉGORIES
        ================================================== -->
      <section id="filters-section">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Rechercher une structure, un mot-clé...">
    </div>
    
    <div class="filter-buttons">
        <span class="filter-label">Étape :</span>
        <button class="filter-btn active" data-filter="all">Toutes</button>
        <button class="filter-btn" data-filter="germe">Germe</button>
        <button class="filter-btn" data-filter="grandit">Grandit</button>
        <button class="filter-btn" data-filter="forme">Prend forme</button>
        <button class="filter-btn" data-filter="solution">Solution</button>
        <button class="filter-btn" data-filter="deploie">Déploie</button>
    </div>
</section>

        <!-- =================================================
             GALERIE DES PORTRAITS
        ================================================== -->
        <section id="gallery">
            <div class="loading">
                Chargement des portraits…
            </div>
        </section>


        <!-- =================================================
             FICHE DÉTAILLÉE
        ================================================== -->
        <section id="detail" class="detail-view" hidden>
            <button id="back-button" class="back-button" type="button">
                ← Retour aux portraits
            </button>

            <div id="detail-content">
                <!-- Le contenu de l'interview sera créé automatiquement par JavaScript -->
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
